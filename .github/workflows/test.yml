name: Test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify installed CLI and deterministic replay
        run: |
          event_dir="$(mktemp -d)"
          companion-mind demo --event-log "$event_dir/events.jsonl" > "$event_dir/live.json"
          companion-mind replay --event-log "$event_dir/events.jsonl" > "$event_dir/replayed.json"
          cmp "$event_dir/live.json" "$event_dir/replayed.json"

          python - <<'PY' > "$event_dir/mitigation.json"
          import json
          from companion_mind.runtime import MitigationSpec
          print(json.dumps(MitigationSpec.default().runtime_mapping()))
          PY
          companion-mind validate-mitigation \
            --mitigation-spec "$event_dir/mitigation.json" \
            > "$event_dir/validated.json"
          test -s "$event_dir/validated.json"
