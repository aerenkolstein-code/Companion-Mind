name: ENG-DIAG-01C GLM Three-Model Native Persona Baseline

on:
  workflow_dispatch:
    inputs:
      confirm_glm_run:
        description: "Type RUN_60_GLM_CALLS to authorize exactly 60 GLM API calls"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eng-diag-01c-glm-three-model-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-model-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      GLM_45_AIR_MODEL: glm-4.5-air
      GLM_41V_THINKING_FLASHX_MODEL: glm-4.1v-thinking-flashx
      GLM_47_FLASH_MODEL: glm-4.7-flash
      LIN_ZHIYAO_CORPUS_B64: ${{ secrets.LIN_ZHIYAO_CORPUS_B64 }}
    steps:
      - name: Check GLM-run authorization
        shell: bash
        run: |
          [[ "${{ inputs.confirm_glm_run }}" == "RUN_60_GLM_CALLS" ]] && exit 0
          echo "GLM run was not explicitly authorized" >&2
          exit 2

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify private inputs are configured
        shell: bash
        run: |
          for name in GLM_API_KEY LIN_ZHIYAO_CORPUS_B64; do
            if [[ -z "${!name}" ]]; then
              echo "$name repository secret is not configured" >&2
              exit 2
            fi
          done

      - name: Run three GLM Native baselines
        id: diagnostic
        shell: bash
        run: |
          set +e
          python scripts/cross_model_native_baseline.py \
            --private-output eng-diag-01c-private.json \
            --blind-output eng-diag-01c-blind.json \
            --public-output eng-diag-01c-public.json
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          test -s eng-diag-01c-private.json
          test -s eng-diag-01c-blind.json
          test -s eng-diag-01c-public.json

      - name: Encrypt private and blind-review results
        shell: bash
        run: |
          openssl cms -encrypt -binary -aes-256-cbc \
            -in eng-diag-01c-private.json \
            -outform DER \
            -out eng-diag-01c-private.p7m \
            .github/keys/lin_zhiyao_baseline_recipient.crt
          openssl cms -encrypt -binary -aes-256-cbc \
            -in eng-diag-01c-blind.json \
            -outform DER \
            -out eng-diag-01c-blind.p7m \
            .github/keys/lin_zhiyao_baseline_recipient.crt
          shred -u eng-diag-01c-private.json eng-diag-01c-blind.json

      - name: Upload encrypted private results
        uses: actions/upload-artifact@v4
        with:
          name: eng-diag-01c-private-encrypted
          path: |
            eng-diag-01c-private.p7m
            eng-diag-01c-blind.p7m
          if-no-files-found: error
          retention-days: 3

      - name: Upload content-free public evidence
        uses: actions/upload-artifact@v4
        with:
          name: eng-diag-01c-public-evidence
          path: eng-diag-01c-public.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce structural gate
        shell: bash
        run: exit "${{ steps.diagnostic.outputs.exit_code }}"
