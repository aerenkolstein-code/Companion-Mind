name: DeepSeek Live Smoke

on:
  push:
    branches:
      - agent/lin-zhiyao-runtime-v0.2-step02
    paths:
      - ".github/workflows/deepseek-live-smoke.yml"
      - "scripts/deepseek_live_smoke.py"
      - "companion_mind/providers/deepseek.py"
      - "companion_mind/runtime.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-live-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify secret is configured
        shell: bash
        run: |
          if [[ -z "$DEEPSEEK_API_KEY" ]]; then
            echo "DEEPSEEK_API_KEY repository secret is not configured" >&2
            exit 2
          fi

      - name: Run paid DeepSeek smoke without content logs
        run: python scripts/deepseek_live_smoke.py
