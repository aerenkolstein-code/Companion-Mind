name: ENG-DIAG-03 GLM-4.7-Flash Runtime v2 Recovery

on:
  push:
    branches:
      - agent/eng-diag-03-glm47-runtime-v2

permissions:
  contents: read

concurrency:
  group: eng-diag-03-glm47-runtime-v2-recovery
  cancel-in-progress: false

jobs:
  glm47-runtime-v2-recovery:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ci: dispatch one-shot ENG-DIAG-03'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      GLM_47_FLASH_MODEL: glm-4.7-flash
      LIN_ZHIYAO_CORPUS_B64: ${{ secrets.LIN_ZHIYAO_CORPUS_B64 }}
    steps:
      - name: Check one-shot Board authorization trigger
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]] || \
             [[ "${{ github.event.head_commit.message }}" != "ci: dispatch one-shot ENG-DIAG-03" ]]; then
            echo "ENG-DIAG-03 one-shot trigger does not match authorization" >&2
            exit 2
          fi

      - name: Check out repository with frozen ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Runtime v2 implementation freeze
        shell: bash
        run: |
          frozen=cfce614b780a139577b4d8e581e2bab143030c45
          git cat-file -e "${frozen}^{commit}"
          git merge-base --is-ancestor "$frozen" HEAD
          git diff --exit-code "$frozen" -- companion_mind personas

      - name: Verify workflow is the exact temporary one-shot trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/glm-runtime-v2-recovery.yml").read_text()
          assert "  push:" in text
          assert "agent/eng-diag-03-glm47-runtime-v2" in text
          assert "ci: dispatch one-shot ENG-DIAG-03" in text
          for forbidden in ("  pull_request:", "  schedule:"):
              assert forbidden not in text
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run complete offline gate before paid calls
        run: python -m pytest -q

      - name: Verify private inputs are configured
        shell: bash
        run: |
          for name in GLM_API_KEY LIN_ZHIYAO_CORPUS_B64; do
            if [[ -z "${!name}" ]]; then
              echo "$name repository secret is not configured" >&2
              exit 2
            fi
          done

      - name: Run the one authorized 20 plus 20 trajectory
        id: diagnostic
        shell: bash
        run: |
          set +e
          python scripts/glm_runtime_v2_recovery.py \
            --private-output eng-diag-03-private.json \
            --blind-output eng-diag-03-blind.json \
            --public-output eng-diag-03-public.json
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          test -s eng-diag-03-private.json
          test -s eng-diag-03-blind.json
          test -s eng-diag-03-public.json

      - name: Encrypt private and blind-review results
        shell: bash
        run: |
          openssl cms -encrypt -binary -aes-256-cbc \
            -in eng-diag-03-private.json \
            -outform DER \
            -out eng-diag-03-private.p7m \
            .github/keys/lin_zhiyao_baseline_recipient.crt
          openssl cms -encrypt -binary -aes-256-cbc \
            -in eng-diag-03-blind.json \
            -outform DER \
            -out eng-diag-03-blind.p7m \
            .github/keys/lin_zhiyao_baseline_recipient.crt
          shred -u eng-diag-03-private.json eng-diag-03-blind.json

      - name: Upload encrypted private results
        uses: actions/upload-artifact@v4
        with:
          name: eng-diag-03-private-encrypted
          path: |
            eng-diag-03-private.p7m
            eng-diag-03-blind.p7m
          if-no-files-found: error
          retention-days: 3

      - name: Upload content-free public evidence
        uses: actions/upload-artifact@v4
        with:
          name: eng-diag-03-public-evidence
          path: eng-diag-03-public.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce structural gate
        shell: bash
        run: exit "${{ steps.diagnostic.outputs.exit_code }}"
