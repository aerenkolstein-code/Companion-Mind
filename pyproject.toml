[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-mind"
version = "0.3.0"
description = "Replayable state and safeguard runtime for long-running LLM workflows"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
companion-mind = "companion_mind.runtime:main"

[tool.setuptools.packages.find]
include = ["companion_mind*"]
