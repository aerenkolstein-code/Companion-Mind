[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-mind"
version = "0.2.0"
description = "Replayable state and safeguard runtime for long-running LLM workflows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
companion-mind = "companion_mind.runtime:main"

[tool.setuptools.packages.find]
include = ["companion_mind*"]
